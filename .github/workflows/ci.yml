name: CI

on:
  push:
  pull_request:

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: shared
        if: always()
        run: ./gradlew --no-daemon :shared:allTests
      - name: server
        if: always()
        run: ./gradlew --no-daemon :server:test
      - name: sim
        if: always()
        run: ./gradlew --no-daemon :sim:test :sim:compileIntegrationTestKotlin
